[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-meter"
dynamic = ["version"]
description = "Self-hosted meter for AI plan limits, reset times, tokens and cost: Claude, ChatGPT/Codex, Kimi, OpenCode Go, DeepSeek, OpenRouter and more."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eslam Elhefny" }]
keywords = ["ai", "llm", "usage", "monitoring", "quota", "rate-limit", "tokens", "claude", "codex", "openrouter", "dashboard", "self-hosted"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/eslamelhefny/AImon"
Issues = "https://github.com/eslamelhefny/AImon/issues"

[project.scripts]
aimeter = "ai_meter.cli:main"

[project.gui-scripts]
aimeter-desktop = "ai_meter.desktop:main"

[tool.hatch.version]
path = "src/ai_meter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_meter"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]
